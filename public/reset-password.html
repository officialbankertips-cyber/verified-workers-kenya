<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset password | Verified Workers</title><link rel="stylesheet" href="/styles.css"></head><body><div class="modal" style="margin:9vh auto"><div class="modal-brand">VW <span>Verified Workers</span></div><h2>Choose a new password</h2><p class="modal-intro">Reset your account password using the secure link sent to your email.</p><form id="reset" class="auth-form"><label>New password</label><input name="password" type="password" minlength="8" required><button class="btn btn-primary">Reset password</button></form><div id="msg" class="message"></div><p class="switch-auth"><a href="/">Return to Verified Workers</a></p></div><script>document.querySelector('#reset').onsubmit=async e=>{e.preventDefault();const password=new FormData(e.target).get('password');const token=new URLSearchParams(location.search).get('token');try{const r=await fetch('/api/account/password/reset',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password,token})});const d=await r.json();if(!r.ok)throw Error(d.error);document.querySelector('#msg').textContent=d.message;document.querySelector('#msg').className='message ok'}catch(x){document.querySelector('#msg').textContent=x.message}};</script></body></html>
